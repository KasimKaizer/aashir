name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.12.22
          enable-cache: true

      - name: Install project and development dependencies
        run: uv sync --locked --all-groups

      - name: Check formatting
        run: uv run --locked ruff format --check .

      - name: Check lint
        run: uv run --locked ruff check --output-format=github .

      - name: Check types
        run: uv run --locked pyrefly check

      - name: Check type coverage
        run: uv run --locked pyrefly coverage check

      - name: Run tests with coverage
        run: uv run --locked pytest --cov --cov-report=term-missing

      - name: Audit dependencies
        run: uv audit --locked

  tests:
    name: tests (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Full Python coverage on Linux; baseline Python on Windows and macOS.
        include:
          - { os: ubuntu-latest, python-version: "3.14" }
          - { os: ubuntu-latest, python-version: "3.15" }
          - { os: windows-latest, python-version: "3.14" }
          - { os: macos-latest, python-version: "3.14" }
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.12.22
          enable-cache: true

      - name: Install project and development dependencies
        run: uv sync --locked --all-groups

      - name: Run tests
        run: uv run --locked pytest

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.12.22
          enable-cache: true

      - name: Build distributions
        run: uv build

      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  smoke:
    name: smoke (${{ matrix.os }}, 3.14)
    needs: [build]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.12.22
          enable-cache: true

      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Smoke test wheel
        shell: bash
        run: uv run --isolated --no-project --with dist/*.whl aashir -h

      - name: Smoke test sdist
        shell: bash
        run: uv run --isolated --no-project --with dist/*.tar.gz aashir -h

  ci:
    name: CI gate
    if: always()
    needs: [quality, tests, build, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify required jobs succeeded
        run: |
          if [ "${{ needs.quality.result }}" != "success" ]; then
            echo "quality: ${{ needs.quality.result }}"
            exit 1
          fi
          if [ "${{ needs.tests.result }}" != "success" ]; then
            echo "tests: ${{ needs.tests.result }}"
            exit 1
          fi
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "build: ${{ needs.build.result }}"
            exit 1
          fi
          if [ "${{ needs.smoke.result }}" != "success" ]; then
            echo "smoke: ${{ needs.smoke.result }}"
            exit 1
          fi
