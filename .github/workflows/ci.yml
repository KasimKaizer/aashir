name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.14"
          - os: ubuntu-latest
            python-version: "3.15"
          - os: windows-latest
            python-version: "3.14"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.12.22
          enable-cache: true

      - name: Install project and development dependencies
        run: uv sync --locked --all-groups

      - name: Check formatting
        run: uv run --locked ruff format --check .

      - name: Check lint
        run: uv run --locked ruff check --output-format=github .

      - name: Check types
        run: uv run --locked pyrefly check

      - name: Check type coverage
        run: uv run --locked pyrefly coverage check

      - name: Run tests
        run: uv run --locked pytest --cov --cov-report=term-missing

      - name: Build distributions
        if: runner.os == 'Linux' && matrix.python-version == '3.14'
        run: uv build

      - name: Smoke test wheel
        if: runner.os == 'Linux' && matrix.python-version == '3.14'
        shell: bash
        run: uv run --isolated --no-project --with dist/*.whl aashir -h

      - name: Smoke test sdist
        if: runner.os == 'Linux' && matrix.python-version == '3.14'
        shell: bash
        run: uv run --isolated --no-project --with dist/*.tar.gz aashir -h

      - name: Audit dependencies
        if: runner.os == 'Linux' && matrix.python-version == '3.14'
        run: uv audit --locked

  ci:
    name: CI gate
    if: always()
    needs: [checks]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify checks succeeded
        run: |
          if [ "${{ needs.checks.result }}" != "success" ]; then
            echo "checks: ${{ needs.checks.result }}"
            exit 1
          fi
