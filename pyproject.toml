[project]
name = "aashir"
version = "0.1.0"
description = "The Agent"
readme = "README.md"
authors = [
    { name = "Kasim Kaizer", email = "155087257+KasimKaizer@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "python-dotenv>=1.2.3",
    "openai>=3.19.0",
    "pydantic>=2.13.5",
]

[project.scripts]
aashir = "aashir.cli:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.0",
    "pyrefly>=1.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyrefly]
preset = "strict"
search-path = ["."]

[tool.ruff]
target-version = "py314"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "PTH", "ISC001", "ISC002", "ISC003"]

[tool.ruff.lint.isort]
known-first-party = ["aashir", "tests"]
